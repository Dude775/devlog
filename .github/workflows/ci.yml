name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  verify:
    name: Verify (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    # Real Postgres for apps/api repository integration tests (TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devlog
          POSTGRES_PASSWORD: devlog
          POSTGRES_DB: devlog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devlog -d devlog_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://devlog:devlog@localhost:5432/devlog_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.app }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.app }}-

      - run: pnpm install --frozen-lockfile

      # `...` includes the app's workspace dependencies (e.g. @devlog/shared).
      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build --filter=@devlog/${{ matrix.app }}...

  e2e:
    name: E2E smoke (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-e2e-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-e2e-

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @devlog/web exec playwright install --with-deps chromium

      # Builds web (standalone) then runs Playwright against it with the API down.
      - name: Playwright smoke tests
        run: pnpm turbo run test:e2e --filter=@devlog/web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: Docker (${{ matrix.app }})
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    env:
      # Images are pushed to GHCR only for pushes to main; PRs build without pushing.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        id: image
        # GHCR requires a lowercase repository path.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devlog-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=devlog-${{ matrix.app }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: ${{ env.PUSH == 'true' }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public URLs are inlined into the web bundle at build time (ignored by the api image).
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
